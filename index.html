<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="mailat.svg" type="image/x-icon">
    <title>WP Reader</title>
</head>
<body>
    <div id="root">
        <header id="site-header"></header>
        <main id="site-main"></main>
        <footer id="site-footer"></footer>
    </div>

    <script>
        const WPSITENAME = 'yoursitename';
        const WPSITENUMBER = '123456789';
        const TESTMODE = true;

        const headerEl = document.getElementById('site-header');
        const mainEl = document.getElementById('site-main');
        const footerEl = document.getElementById('site-footer');

        const skeletonRows = (length) =>
            '<div class="skeleton_row"></div>'.repeat(length);

        const fakeDelay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function fetchJSON(url, delay = 0) {
            if (TESTMODE && delay) await fakeDelay(delay); // simulate loading time
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
            return res.json();
        }

        // --- Meta: header + footer ---
        function renderMeta(meta) {
            headerEl.innerHTML = `
                <h1>${meta.name}</h1>
                <p>${meta.description}</p>
            `;
            footerEl.innerHTML = `
                <a href="${meta.URL}" target="_blank">${meta.URL}</a>
            `;
        }

        async function loadMeta() {
            headerEl.innerHTML = skeletonRows(2);
            const url = TESTMODE
                ? 'data/wp_site.json'
                : `https://public-api.wordpress.com/rest/v1/sites/${WPSITENAME}.wordpress.com/`;
            try {
                const meta = await fetchJSON(url, 1000);
                renderMeta(meta);
            } catch (error) {
                console.error("Failed to load site info:", error);
                headerEl.innerHTML = '<div style="color: red;">Failed to load site info.</div>';
            }
        }

        // --- Posts: main content ---
        function renderPosts(data) {
            const filtered = data.posts.filter(post => post.categories.postitem);
            const list = filtered.map(post => `<li>${post.title}</li>`).join('');
            mainEl.innerHTML = `<ul>${list}</ul>`;
        }

        async function loadPosts() {
            mainEl.innerHTML = skeletonRows(3);
            const url = TESTMODE
                ? 'data/wp_posts.json'
                : `https://public-api.wordpress.com/rest/v1.1/sites/${WPSITENUMBER}/posts/`;
            try {
                const data = await fetchJSON(url, 3000);
                renderPosts(data);
            } catch (error) {
                console.error("Failed to load posts:", error);
                mainEl.innerHTML = '<div style="color: red;">Failed to load posts.</div>';
            }
        }

        function main() {
            const params = new URLSearchParams(window.location.search);
            const urlSlug = params.get('slug');

            loadMeta();   // not awaited: runs in parallel
            loadPosts();
        }
        main();
    </script>
</body>
</html>
